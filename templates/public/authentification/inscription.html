{% load static  %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="{% static 'src/output.css' %}">
</head>
<body class="bg-white m-0 p-0">

<div class="min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 ">
  <div class="flex items-center gap-3 mb-2">
    <div class="bg-blue-600 text-white p-2 rounded-full"><i class="text-xl"> 👤 +</i></div>
    <div><h2 class="text-xl font-bold text-[#0f2040]">Inscription Commissionnaire</h2><p class="text-xs text-gray-500">Remplissez le formulaire pour devenir commissionnaire.</p></div>
  </div>

  <div class="flex items-center gap-4 my-6">
    <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center text-3xl">👤</div>
    <div><label class="text-sm font-semibold">Photo de profil</label><input type="file" class="block mt-1 text-sm bg-blue-50 text-blue-600 px-4 py-2 rounded-lg file:border-0"><p class="text-[11px] text-gray-400 mt-1">JPG, PNG (Max 2 Mo)</p></div>
  </div>

  <div class="grid grid-cols-1 gap-4">
    <div><label class="text-sm font-semibold">Nom complet </label><input class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Votre nom et prénom"></div>
    <div><label class="text-sm font-semibold">Adresse e-mail </label><input class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm" placeholder="exemple@domaine.com"></div>
    <div><label class="text-sm font-semibold">Téléphone </label><input class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm" placeholder="+257 79 123 456"></div>
    <div><label class="text-sm font-semibold">Ville d'activité </label><select class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm"><option>-- Sélectionner une ville --</option><option>Bujumbura</option><option>Bukavu</option><option>Goma</option></select></div>
    <div><label class="text-sm font-semibold">Adresse professionnelle </label><input class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm" placeholder="Votre adresse"></div>
    
    <div class="grid grid-cols-2 gap-4">
      <div><label class="text-sm font-semibold">Mot de passe </label><input type="password" class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm" placeholder="Au moins 8 caractères"></div>
      <div><label class="text-sm font-semibold">Confirmer </label><input type="password" class="w-full mt-1 border border-gray-300 rounded-lg px-4 py-3 text-sm" placeholder="Répétez le mot de passe"></div>
    </div>

    <div><label class="text-sm font-semibold">Pièce d'identité </label><input type="file" class="w-full mt-1 border border-dashed border-gray-300 rounded-lg px-4 py-3 text-sm"></div>

    <label class="flex gap-2 text-xs mt-2"><input type="checkbox"> J'accepte les <span class="text-blue-600">conditions d'utilisation</span> de RENT HOUSE.</label>

    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl mt-2"> S'inscrire</button>
    <p class="text-center text-xs">Déjà inscrit ? <a class="text-blue-600 font-semibold">Se connecter</a></p>
  </div>
</div>

</body>
</html>
