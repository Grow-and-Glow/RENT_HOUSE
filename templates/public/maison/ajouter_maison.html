{% extends 'baseApp.html' %}


{% block content %}
<main class="w-full">

    <div class="p-6 md:p-10">

        <div class="max-w-6xl mx-auto">


            <!-- INTRODUCTION -->
            <div class="mb-7">

                <h2 class="text-2xl font-bold text-slate-800">
                    Informations de la propriété
                </h2>

                <p class="text-slate-500 mt-1">
                    Complétez les informations pour ajouter votre maison.
                </p>

            </div>

            <!-- FORMULAIRE -->

            <form id="houseForm"
                  class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">


                    <!-- COLONNE GAUCHE : PHOTOS -->

                    <div>

                        <h3 class="font-bold text-lg mb-4">
                            Photos de la maison
                        </h3>


                        <!-- PHOTO PRINCIPALE -->
                        <div class="group relative overflow-hidden rounded-2xl cursor-pointer shadow-md">

                            <img
                                src="/static/photo/maison10.jpg"
                                alt="Photo principale de la maison"
                                class="w-full h-64 object-cover transition-transform duration-700 ease-in-out group-hover:scale-110">

                            <div class="absolute inset-0 bg-blue-600/0 group-hover:bg-blue-600/20 transition-all duration-700"></div>

                        </div>
                    <div></div>



                        <!-- BOUTON AJOUTER UNE PHOTO -->

                        <div class="mt-4">

                            <label for="photos" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl bg-blue-600 text-white font-semibold cursor-pointer hover:bg-blue-700 transition">

                                <span class="text-xl"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24">
	                            <path d="M0 0h24v24H0z" fill="none" />
	                            <path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" /></svg>
                                </span> Ajouter une photo
                            </label>

                        </div>



                        <!-- APERÇU DES PHOTOS -->
                        <div id="preview"class="grid grid-cols-3 gap-3 mt-4"></div>

                    </div>


                    <div class="space-y-5">

                        <div>

                            <label class="block font-semibold text-sm mb-2">
                                Titre de l'annonce
                            </label>

                            <input
                                type="text"
                                placeholder="Ex : Belle maison moderne"
                                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500">

                        </div>



                        <!-- TYPE DE MAISON -->
                        <div>

                            <label class="block font-semibold text-sm mb-2">
                                Type de maison
                            </label>

                            <select class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500">

                                <option value="">
                                    Choisir un type
                                </option>

                                <option>Villa</option>
                                <option>Appartement</option>
                                <option>Maison familiale</option>
                                <option>Studio</option>

                            </select>

                        </div>



                        <!-- PRIX -->
                        <div>

                            <label class="block font-semibold text-sm mb-2">
                                Prix de location
                            </label>

                            <input type="number"placeholder="Ex : 500"class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500">

                        </div>



                        <!-- LOCALISATION -->
                        <div>

                            <label class="block font-semibold text-sm mb-2">
                                Localisation
                            </label>

                            <input type="text" placeholder="Ex : Bujumbura, Rohero" class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500">

                        </div>

                        <!-- DESCRIPTION -->

                        <div>

                            <label class="block font-semibold text-sm mb-2">
                                Description
                            </label>

                            <textarea rows="4" placeholder="Décrivez votre maison..." class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 resize-none">
                            </textarea>

                        </div>


                    </div>

                </div>

                <!-- BOUTONS -->

                <div class="flex justify-end gap-3 mt-10 pt-6 border-t border-slate-200">

                    <button type="reset" class="px-6 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition"> Réinitialiser</button>


                    <button type="submit" class="px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">Enregistrer la maison</button>

                </div>

            </form>

        </div>

    </div>

</main>
    

{% endblock %}
